# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Dependabot should not routinely bump Home Assistant, since that should match the
      # homeassistant key in hacs.json - but security-fix PRs still get through (this pin
      # is dev/test tooling, not something that reaches users' installed integration), so
      # this is scoped to version-updates only rather than blocking Dependabot entirely.
      - dependency-name: "homeassistant"
        applies-to: "version-updates"